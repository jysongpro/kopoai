<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신규신청(학사담당) - 2027학년도 교과과정개편 연수</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1>2027학년도 교과과정개편 연수 신청</h1>
  <p>학교법인 한국폴리텍대학 AI혁신부</p>
</header>
<nav class="menu">
  <a href="index.html">홈</a>
  <a href="apply-staff.html" class="active">신규신청(학사담당)</a>
  <a href="apply-dept.html">신규신청(학과장)</a>
  <a href="edit-dept.html">변경하기(학과장)</a>
  <a href="admin.html">관리자</a>
</nav>
<main>
  <div class="card">
    <h2>신규신청 (학사담당)</h2>
    <p class="small">신청 인원 제한이 없습니다. 아래 정보를 입력해 주세요.</p>
    <form id="staffForm">
      <div class="grid2">
        <div class="field">
          <label>대학 *</label>
          <select id="university" required>
            <option value="">선택하세요</option>
          </select>
        </div>
        <div class="field">
          <label>캠퍼스 *</label>
          <select id="campus" required disabled>
            <option value="">대학을 먼저 선택하세요</option>
          </select>
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>직급 *</label>
          <input type="text" id="position" placeholder="예) 교학팀장" required>
        </div>
        <div class="field">
          <label>이름 *</label>
          <input type="text" id="name" placeholder="이름을 입력하세요" required>
        </div>
      </div>
      <div class="field">
        <label>담당과정 * (복수선택 가능)</label>
        <div class="checkbox-group" id="courseGroup"></div>
      </div>
      <button type="submit">신청하기</button>
      <div id="msg" class="msg"></div>
    </form>
  </div>
</main>

<script src="js/campus-data.js"></script>
<script>
// Firebase 연동과 무관하게 항상 동작하는 UI 초기화 (일반 스크립트)
(function initUI() {
  const uniSelect = document.getElementById("university");
  const campSelect = document.getElementById("campus");
  const courseGroup = document.getElementById("courseGroup");

  Object.keys(CAMPUS_DATA).forEach(u => {
    const opt = document.createElement("option");
    opt.value = u; opt.textContent = u + "대학";
    uniSelect.appendChild(opt);
  });

  STAFF_COURSE_OPTIONS.forEach(c => {
    const label = document.createElement("label");
    label.innerHTML = `<input type="checkbox" name="course" value="${c}"> ${c}`;
    courseGroup.appendChild(label);
  });

  uniSelect.addEventListener("change", () => {
    const u = uniSelect.value;
    campSelect.innerHTML = "";
    if (!u) {
      campSelect.disabled = true;
      campSelect.innerHTML = '<option value="">대학을 먼저 선택하세요</option>';
      return;
    }
    campSelect.disabled = false;
    campSelect.innerHTML = '<option value="">선택하세요</option>';
    CAMPUS_DATA[u].forEach(c => {
      const opt = document.createElement("option");
      opt.value = c; opt.textContent = c;
      campSelect.appendChild(opt);
    });
  });
})();
</script>
<script type="module">
import { db, collection, addDoc, serverTimestamp } from "./js/firebase-init.js";

const uniSelect = document.getElementById("university");
const campSelect = document.getElementById("campus");
const msg = document.getElementById("msg");

function showMsg(text, ok) {
  msg.textContent = text;
  msg.className = "msg show " + (ok ? "ok" : "err");
}

document.getElementById("staffForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const courses = Array.from(document.querySelectorAll('input[name="course"]:checked')).map(el => el.value);
  if (courses.length === 0) {
    showMsg("담당과정을 1개 이상 선택해 주세요.", false);
    return;
  }
  const data = {
    university: uniSelect.value,
    campus: campSelect.value,
    courses,
    position: document.getElementById("position").value.trim(),
    name: document.getElementById("name").value.trim(),
    createdAt: serverTimestamp()
  };
  const btn = e.target.querySelector("button");
  btn.disabled = true;
  try {
    await addDoc(collection(db, "staffApplications"), data);
    showMsg("신청이 완료되었습니다.", true);
    e.target.reset();
    campSelect.disabled = true;
    campSelect.innerHTML = '<option value="">대학을 먼저 선택하세요</option>';
  } catch (err) {
    console.error(err);
    showMsg("신청 중 오류가 발생했습니다: " + err.message, false);
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
