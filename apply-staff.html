<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신규신청(학사담당) - 2027학년도 교과과정개편 교육</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a href="admin.html" class="admin-link">관리자</a>
  <h1>2027학년도 교과과정개편 교육 신청</h1>
  <p>학교법인 한국폴리텍대학 AI혁신부</p>
</header>
<nav class="menu">
  <a href="index.html">홈</a>
  <a href="apply-staff.html" class="active">신규신청(학사담당)</a>
  <a href="apply-dept.html">신규신청(학과장)</a>
  <a href="edit-dept.html">변경하기(학과장)</a>
</nav>

<main>
  <div class="card">
    <h2>신규신청 (학사담당)</h2>
    <p class="small">신청 인원 제한이 없습니다. 아래 정보를 입력해 주세요.</p>
    <form id="staffForm">
      <div class="grid2">
        <div class="field">
          <label>대학 *</label>
          <select id="university" required>
            <option value="">선택하세요</option>
          </select>
        </div>
        <div class="field">
          <label>캠퍼스 *</label>
          <select id="campus" required disabled>
            <option value="">대학을 먼저 선택하세요</option>
          </select>
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>직급 *</label>
          <input type="text" id="position" placeholder="주임" required>
        </div>
        <div class="field">
          <label>이름 *</label>
          <input type="text" id="name" placeholder="이름을 입력하세요" required>
        </div>
      </div>
      <div class="field">
        <label>담당과정 * (복수선택 가능)</label>
        <div class="checkbox-group" id="courseGroup"></div>
      </div>
      <div class="field">
        <label>참석 차수 *</label>
        <div class="radio-cards" id="roundList"></div>
      </div>
      <button type="submit" id="submitBtn">신청하기</button>
      <div id="msg" class="msg"></div>
    </form>
  </div>
</main>

<script src="js/campus-data.js"></script>
<script>
// Firebase 연동과 무관하게 항상 동작하는 UI 초기화 (일반 스크립트)
(function initUI() {
  const uniSelect = document.getElementById("university");
  const campSelect = document.getElementById("campus");
  const courseGroup = document.getElementById("courseGroup");

  Object.keys(CAMPUS_DATA).forEach(u => {
    const opt = document.createElement("option");
    opt.value = u; opt.textContent = u + "대학";
    uniSelect.appendChild(opt);
  });

  STAFF_COURSE_OPTIONS.forEach(c => {
    const label = document.createElement("label");
    label.innerHTML = `<input type="checkbox" name="course" value="${c}"> ${c}`;
    courseGroup.appendChild(label);
  });

  uniSelect.addEventListener("change", () => {
    const u = uniSelect.value;
    campSelect.innerHTML = "";
    if (!u) {
      campSelect.disabled = true;
      campSelect.innerHTML = '<option value="">대학을 먼저 선택하세요</option>';
      return;
    }
    campSelect.disabled = false;
    campSelect.innerHTML = '<option value="">선택하세요</option>';
    CAMPUS_DATA[u].forEach(c => {
      const opt = document.createElement("option");
      opt.value = c; opt.textContent = c;
      campSelect.appendChild(opt);
    });
  });
})();
</script>
<script type="module">
import { db, collection, addDoc, serverTimestamp } from "./js/firebase-init.js";
import { getSettings, isApplyPeriodOpen, getRounds, getRoundCount } from "./js/utils.js";

const uniSelect = document.getElementById("university");
const campSelect = document.getElementById("campus");
const roundList = document.getElementById("roundList");
const msg = document.getElementById("msg");
const submitBtn = document.getElementById("submitBtn");

let roundsCache = [];
let periodOpen = true;

function showMsg(text, ok) {
  msg.textContent = text;
  msg.className = "msg show " + (ok ? "ok" : "err");
}

async function checkPeriod() {
  try {
    const settings = await getSettings();
    periodOpen = isApplyPeriodOpen(settings);
  } catch (err) {
    console.error(err);
    periodOpen = true;
  }
  if (!periodOpen) submitBtn.disabled = true;
}
checkPeriod();

async function loadRounds() {
  roundsCache = await getRounds("staffRounds");
  roundList.innerHTML = "";
  if (roundsCache.length === 0) {
    roundList.innerHTML = '<p class="small">관리자가 아직 회차 정보를 등록하지 않았습니다.</p>';
    return;
  }
  const params = new URLSearchParams(window.location.search);
  const preselectRound = params.get("round");
  for (const r of roundsCache) {
    const count = await getRoundCount("staffApplications", r.id);
    const isFull = r.maxCount && count >= r.maxCount;
    const label = document.createElement("label");
    label.className = isFull ? "full" : "";
    const checked = (preselectRound && String(r.id) === preselectRound && !isFull) ? "checked" : "";
    label.innerHTML = `
      <span>
        <input type="radio" name="round" value="${r.id}" ${isFull ? "disabled" : ""} ${checked}>
        <b>${r.id}차</b> · ${r.location || "장소 미정"} · ${r.period || "기간 미정"}
      </span>
      <span class="tag ${isFull ? "full" : ""}">${count} / ${r.maxCount || "제한없음"}${isFull ? " 마감" : ""}</span>
    `;
    roundList.appendChild(label);
  }
  if (preselectRound) {
    document.getElementById("staffForm").scrollIntoView({ behavior: "smooth", block: "start" });
  }
}
loadRounds();

document.getElementById("staffForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!periodOpen) {
    showMsg("현재는 신청 기간이 아닙니다.", false);
    return;
  }
  const courses = Array.from(document.querySelectorAll('input[name="course"]:checked')).map(el => el.value);
  if (courses.length === 0) {
    showMsg("담당과정을 1개 이상 선택해 주세요.", false);
    return;
  }
  const roundEl = document.querySelector('input[name="round"]:checked');
  if (!roundEl) {
    showMsg("참석 차수를 선택해 주세요.", false);
    return;
  }
  const round = parseInt(roundEl.value, 10);

  submitBtn.disabled = true;
  try {
    const roundInfo = roundsCache.find(r => r.id === round);
    const count = await getRoundCount("staffApplications", round);
    if (roundInfo && roundInfo.maxCount && count >= roundInfo.maxCount) {
      showMsg("선택하신 차수는 방금 정원이 마감되었습니다. 다른 차수를 선택해 주세요.", false);
      submitBtn.disabled = false;
      loadRounds();
      return;
    }

    const data = {
      university: uniSelect.value,
      campus: campSelect.value,
      courses,
      position: document.getElementById("position").value.trim(),
      name: document.getElementById("name").value.trim(),
      round,
      createdAt: serverTimestamp()
    };
    await addDoc(collection(db, "staffApplications"), data);
    showMsg("신청이 완료되었습니다.", true);
    e.target.reset();
    campSelect.disabled = true;
    campSelect.innerHTML = '<option value="">대학을 먼저 선택하세요</option>';
    loadRounds();
  } catch (err) {
    console.error(err);
    showMsg("신청 중 오류가 발생했습니다: " + err.message, false);
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
