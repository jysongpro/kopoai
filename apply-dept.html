<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신규신청(학과장) - 2027학년도 교과과정개편 교육</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a href="admin.html" class="admin-link">관리자</a>
  <h1>2027학년도 교과과정개편 교육 신청</h1>
  <p>학교법인 한국폴리텍대학 AI혁신부</p>
</header>
<nav class="menu">
  <a href="index.html">홈</a>
  <a href="apply-staff.html">신규신청(학사담당)</a>
  <a href="apply-dept.html" class="active">신규신청(학과장)</a>
  <a href="edit-dept.html">변경하기(학과장)</a>
</nav>

<main>
  <div class="card">
    <h2>신규신청 (학과장)</h2>
    <p class="small">전화번호를 기본키로 사용합니다. 동일 전화번호로는 중복 신청이 불가합니다.</p>
    <div id="periodMsg" class="msg"></div>
    <form id="deptForm">
      <div class="field">
        <label>전화번호 * (기본키, 숫자만 입력)</label>
        <input type="tel" id="phone" placeholder="예) 01012345678" required>
        <div class="hint">'-' 없이 숫자만 입력해 주세요.</div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>대학 *</label>
          <select id="university" required>
            <option value="">선택하세요</option>
          </select>
        </div>
        <div class="field">
          <label>캠퍼스 *</label>
          <select id="campus" required disabled>
            <option value="">대학을 먼저 선택하세요</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>학과 *</label>
        <select id="dept" required disabled>
          <option value="">캐퍼스를 먼저 선택하세요</option>
        </select>
      </div>
      <div class="grid2">
        <div class="field">
          <label>직급 *</label>
          <input type="text" id="position" placeholder="예) 학과장" required>
        </div>
        <div class="field">
          <label>이름 / 학과장 여부 *</label>
          <div style="display:flex; gap:8px; align-items:center;">
            <input type="text" id="name" placeholder="이름을 입력하세요" required style="flex:1;">
            <label style="display:flex;align-items:center;gap:4px;white-space:nowrap;font-weight:500;font-size:13px;background:var(--blue-light);padding:8px 12px;border-radius:8px;"><input type="checkbox" id="isHead" value="Y"> 학과장</label>
          </div>
        </div>
      </div>
      <div class="field">
        <label>교과편성 과정 * (복수선택 가능)</label>
        <div class="checkbox-group" id="courseGroup"></div>
      </div>
      <div class="field">
        <label>숙박 여부 *</label>
        <div class="checkbox-group">
          <label><input type="radio" name="stay" value="Y" required> 숙박함</label>
          <label><input type="radio" name="stay" value="N"> 숙박 안함</label>
        </div>
      </div>
      <div class="field">
        <label>참석 차수 *</label>
        <div class="radio-cards" id="roundList"></div>
      </div>
      <button type="submit" id="submitBtn">신청하기</button>
      <div id="msg" class="msg"></div>
    </form>
  </div>
</main>

<script src="js/campus-data.js"></script>
<script>
// Firebase 연동과 무관하게 항상 동작하는 UI 초기화 (일반 스크립트)
(function initUI() {
  const uniSelect = document.getElementById("university");
  const campSelect = document.getElementById("campus");
  const courseGroup = document.getElementById("courseGroup");

  const deptSelect = document.getElementById("dept");

  Object.keys(CAMPUS_DATA).forEach(u => {
    const opt = document.createElement("option");
    opt.value = u; opt.textContent = u + "대학";
    uniSelect.appendChild(opt);
  });

  Object.entries(COURSE_OPTIONS).forEach(([group, items]) => {
    const title = document.createElement("div");
    title.className = "group-title";
    title.textContent = group;
    courseGroup.appendChild(title);
    items.forEach(c => {
      const label = document.createElement("label");
      label.innerHTML = `<input type="checkbox" name="course" value="${c}"> ${c}`;
      courseGroup.appendChild(label);
    });
  });

  function resetDept() {
    deptSelect.disabled = true;
    deptSelect.innerHTML = '<option value="">캐퍼스를 먼저 선택하세요</option>';
  }

  uniSelect.addEventListener("change", () => {
    const u = uniSelect.value;
    campSelect.innerHTML = "";
    resetDept();
    if (!u) {
      campSelect.disabled = true;
      campSelect.innerHTML = '<option value="">대학을 먼저 선택하세요</option>';
      return;
    }
    campSelect.disabled = false;
    campSelect.innerHTML = '<option value="">선택하세요</option>';
    CAMPUS_DATA[u].forEach(c => {
      const opt = document.createElement("option");
      opt.value = c; opt.textContent = c;
      campSelect.appendChild(opt);
    });
  });

  campSelect.addEventListener("change", () => {
    const u = uniSelect.value;
    const c = campSelect.value;
    if (!u || !c) { resetDept(); return; }
    const depts = (DEPT_DATA[u] && DEPT_DATA[u][c]) || [];
    deptSelect.disabled = false;
    deptSelect.innerHTML = '<option value="">선택하세요</option>';
    depts.forEach(d => {
      const opt = document.createElement("option");
      opt.value = d; opt.textContent = d;
      deptSelect.appendChild(opt);
    });
  });
})();
</script>
<script type="module">
import { db, doc, setDoc, getDoc, serverTimestamp } from "./js/firebase-init.js";
import { getSettings, isApplyPeriodOpen, getRounds, getRoundCount, formatPhone } from "./js/utils.js";

const uniSelect = document.getElementById("university");
const campSelect = document.getElementById("campus");
const roundList = document.getElementById("roundList");
const msg = document.getElementById("msg");
const periodMsg = document.getElementById("periodMsg");
const submitBtn = document.getElementById("submitBtn");

let selectedRound = null;
let roundsCache = [];

function showMsg(el, text, ok) {
  el.textContent = text;
  el.className = "msg show " + (ok ? "ok" : "err");
}

async function init() {
  const settings = await getSettings();
  if (!isApplyPeriodOpen(settings)) {
    submitBtn.disabled = true;
  }

  roundsCache = await getRounds("rounds");
  if (roundsCache.length === 0) {
    roundList.innerHTML = '<p class="small">관리자가 아직 회차 정보를 등록하지 않았습니다.</p>';
    return;
  }
  const params = new URLSearchParams(window.location.search);
  const preselectRound = params.get("round");
  for (const r of roundsCache) {
    const count = await getRoundCount("deptApplications", r.id);
    const isFull = r.maxCount && count >= r.maxCount;
    const label = document.createElement("label");
    label.className = isFull ? "full" : "";
    const checked = (preselectRound && String(r.id) === preselectRound && !isFull) ? "checked" : "";
    label.innerHTML = `
      <span>
        <input type="radio" name="round" value="${r.id}" ${isFull ? "disabled" : ""} ${checked}>
        <b>${r.id}차</b> · ${r.location || "장소 미정"} · ${r.period || "기간 미정"}
      </span>
      <span class="tag ${isFull ? "full" : ""}">${count} / ${r.maxCount || "제한없음"}${isFull ? " 마감" : ""}</span>
    `;
    roundList.appendChild(label);
  }
  if (preselectRound) {
    document.getElementById("deptForm").scrollIntoView({ behavior: "smooth", block: "start" });
  }
}
init();

document.getElementById("deptForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const phone = formatPhone(document.getElementById("phone").value.trim());
  if (!phone) { showMsg(msg, "전화번호를 입력해 주세요.", false); return; }

  const deptVal = document.getElementById("dept").value;
  if (!deptVal) { showMsg(msg, "학과를 선택해 주세요.", false); return; }

  const courses = Array.from(document.querySelectorAll('input[name="course"]:checked')).map(el => el.value);
  if (courses.length === 0) { showMsg(msg, "교과편성 과정을 1개 이상 선택해 주세요.", false); return; }

  const isHeadEl = document.getElementById("isHead");
  const stayEl = document.querySelector('input[name="stay"]:checked');
  const roundEl = document.querySelector('input[name="round"]:checked');
  if (!stayEl) { showMsg(msg, "숙박 여부를 선택해 주세요.", false); return; }
  if (!roundEl) { showMsg(msg, "참석 차수를 선택해 주세요.", false); return; }
  const round = parseInt(roundEl.value, 10);

  submitBtn.disabled = true;
  try {
    // 중복 신청 체크
    const existing = await getDoc(doc(db, "deptApplications", phone));
    if (existing.exists()) {
      showMsg(msg, "이미 등록된 전화번호입니다. 동일 전화번호로 중복 신청할 수 없습니다. 변경이 필요하면 '변경하기' 메뉴를 이용해 주세요.", false);
      submitBtn.disabled = false;
      return;
    }

    // 정원 재확인 (동시신청 방지)
    const roundInfo = roundsCache.find(r => r.id === round);
    const count = await getRoundCount("deptApplications", round);
    if (roundInfo && roundInfo.maxCount && count >= roundInfo.maxCount) {
      showMsg(msg, "선택하신 차수는 방금 정원이 마감되었습니다. 다른 차수를 선택해 주세요.", false);
      submitBtn.disabled = false;
      init();
      return;
    }

    await setDoc(doc(db, "deptApplications", phone), {
      phone,
      university: uniSelect.value,
      campus: campSelect.value,
      dept: document.getElementById("dept").value,
      courses,
      position: document.getElementById("position").value.trim(),
      name: document.getElementById("name").value.trim(),
      isHead: isHeadEl.checked ? "Y" : "N",
      stay: stayEl.value,
      round,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });
    showMsg(msg, "신청이 완료되었습니다.", true);
    e.target.reset();
    campSelect.disabled = true;
    campSelect.innerHTML = '<option value="">대학을 먼저 선택하세요</option>';
  } catch (err) {
    console.error(err);
    showMsg(msg, "신청 중 오류가 발생했습니다: " + err.message, false);
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
